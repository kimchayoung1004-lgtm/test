<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또 번호 뽑기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: #eef2ea;
      color: #15291f;
      font: 1.125rem/1.5 system-ui, sans-serif;
    }

    main {
      width: min(100%, 48rem);
      padding: clamp(20px, 5vw, 56px);
      border: 1px solid #c9d6ca;
      border-radius: 28px;
      background: #fffcf5;
      text-align: center;
      box-shadow: 0 12px 42px #15291f14;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.875rem, 6vw, 3.75rem);
      line-height: 1.2;
    }

    .instruction { margin: 12px 0 0; }

    .balls {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 16px);
      max-width: 38rem;
      margin: 32px auto 18px;
    }

    .ball {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 23%, #ffffff88, transparent 65%), var(--ball-color);
      box-shadow: inset 0 -5px 0 #00000019, 0 4px 8px #16291f20;
      color: #18221d;
      font-size: clamp(1.875rem, 5vw, 3.375rem);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .ball:nth-child(1) { --ball-color: #f6c34d; }
    .ball:nth-child(2) { --ball-color: #78c7f5; }
    .ball:nth-child(3) { --ball-color: #fc968f; }
    .ball:nth-child(4) { --ball-color: #88d3a0; }
    .ball:nth-child(5) { --ball-color: #c7a8f5; }
    .ball:nth-child(6) { --ball-color: #ffaf74; }

    #status { min-height: 1.5em; margin: 0 0 20px; }

    button {
      width: min(100%, 24rem);
      min-height: 76px;
      padding: 12px 16px;
      border: 0;
      border-radius: 16px;
      background: #164936;
      color: #fff;
      font: 750 1.75rem/1.3 system-ui, sans-serif;
      cursor: pointer;
    }

    button:not([aria-disabled="true"]):hover { background: #0d3526; }
    button:focus-visible { outline: 3px solid #164936; outline-offset: 5px; }
    button[aria-disabled="true"] { background: #52665c; cursor: wait; }

    @media (max-width: 34rem) {
      .balls {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-width: 19rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>로또 번호 뽑기</h1>
    <p class="instruction">1부터 45까지, 서로 다른 번호 6개를 뽑습니다.</p>

    <div class="balls" aria-hidden="true">
      <span class="ball">–</span>
      <span class="ball">–</span>
      <span class="ball">–</span>
      <span class="ball">–</span>
      <span class="ball">–</span>
      <span class="ball">–</span>
    </div>

    <p id="status" role="status" aria-atomic="true">아래 버튼을 눌러 주세요.</p>
    <button id="draw" type="button">번호 뽑기</button>
    <button id="redraw" type="button" hidden>다시 뽑기</button>
  </main>

  <script>
    const balls = document.querySelectorAll(".ball");
    const status = document.querySelector("#status");
    const drawButton = document.querySelector("#draw");
    const redrawButton = document.querySelector("#redraw");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function drawNumbers() {
      const pool = Array.from({ length: 45 }, (_, index) => index + 1);
      const numbers = [];

      for (let index = 0; index < balls.length; index++) {
        const randomIndex = Math.floor(Math.random() * pool.length);
        numbers.push(pool.splice(randomIndex, 1)[0]);
      }

      return numbers;
    }

    function showNumbers(numbers) {
      balls.forEach((ball, index) => {
        ball.textContent = numbers[index];
      });
    }

    function startDraw(event) {
      const button = event.currentTarget;
      if (button.getAttribute("aria-disabled") === "true") return;
      const result = drawNumbers().sort((a, b) => a - b);
      const finish = () => {
        showNumbers(result);
        status.textContent = "뽑힌 번호는 " + result.join(", ") + "입니다.";
        const moveFocus = button === drawButton && document.activeElement === button;
        drawButton.hidden = true;
        redrawButton.hidden = false;
        button.removeAttribute("aria-disabled");

        if (moveFocus) {
          redrawButton.focus();
        }
      };

      button.setAttribute("aria-disabled", "true");
      status.textContent = "번호를 뽑는 중입니다.";

      if (reduceMotion.matches) {
        finish();
        return;
      }

      showNumbers(drawNumbers());
      const animation = setInterval(() => showNumbers(drawNumbers()), 75);
      setTimeout(() => {
        clearInterval(animation);
        finish();
      }, 1200);
    }

    drawButton.addEventListener("click", startDraw);
    redrawButton.addEventListener("click", startDraw);
  </script>
</body>
</html>
